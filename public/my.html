<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的 - warm-host</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/cn-fontsource-noto-serif-sc-regular@1.0.0/index.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/cn-fontsource-noto-sans-sc-regular@1.0.0/index.css" rel="stylesheet">
</head>
<body>
  <div class="header">
    <span class="header-title">我的</span>
    <button class="header-back" id="btn-logout" title="退出登录">退出</button>
  </div>

  <div class="container page-with-tabbar">

    <!-- 顶部 4 Tab -->
    <div class="my-tabs">
      <button class="my-tab active" data-tab="pets">宠物</button>
      <button class="my-tab" data-tab="needs">需求</button>
      <button class="my-tab" data-tab="orders">订单</button>
      <button class="my-tab" data-tab="host">寄养</button>
    </div>

    <!-- 宠物 Tab -->
    <div class="my-content active" id="tab-pets">
      <button class="btn btn-primary btn-block" id="btn-add-pet">+ 添加宠物</button>
      <div id="pet-list"></div>
    </div>

    <!-- 需求 Tab -->
    <div class="my-content" id="tab-needs">
      <button class="btn btn-primary btn-block" id="btn-add-need">+ 发布寄养需求</button>
      <div id="needs-list"></div>
    </div>

    <!-- 订单 Tab 占位 -->
    <div class="my-content" id="tab-orders">
      <div class="empty-state">
        <span class="emoji">📋</span>
        <h3>订单管理</h3>
        <p>Task 10 完善</p>
      </div>
    </div>

    <!-- 寄养 Tab -->
    <div class="my-content" id="tab-host">
      <!-- 状态提示卡片（根据 host_status 切换显示） -->
      <div id="host-banner" class="host-banner host-banner-hidden"></div>

      <!-- 首单担保提示 -->
      <div id="host-sponsor-hint" class="host-sponsor-hint host-banner-hidden"></div>

      <!-- 寄养人档案表单（申请表 + 编辑表共用一套 DOM，通过 host-status 控制可编辑性） -->
      <form id="host-form" class="host-form card">
        <h3 class="host-form-title" id="host-form-title">寄养人档案</h3>
        <div class="form-group">
          <label>自我介绍</label>
          <textarea name="bio" maxlength="500" placeholder="说说你的养宠经验、居住环境…"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>同时寄养数量 <span class="required">*</span></label>
            <input type="number" name="capacity_count" min="1" max="10" step="1" value="2" required>
          </div>
          <div class="form-group">
            <label>日费（分）</label>
            <input type="number" name="daily_rate_cents" min="0" step="100" value="10000">
          </div>
        </div>
        <div class="form-group">
          <label>可寄养品种 <span class="required">*</span></label>
          <div class="chip-group" id="capacity-species-chips"></div>
        </div>
        <div class="form-group">
          <label>可寄养体型 <span class="required">*</span></label>
          <div class="chip-group" id="capacity-size-chips"></div>
        </div>
        <div class="form-group">
          <label>可寄养性别 <span class="required">*</span></label>
          <div class="chip-group" id="capacity-gender-chips"></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>所在区域 <span class="required">*</span></label>
            <input type="text" name="district" maxlength="20" placeholder="如：朝阳区" required>
          </div>
          <div class="form-group">
            <label>详细位置（模糊）</label>
            <input type="text" name="address_fuzzy" maxlength="100" placeholder="如：某小区">
          </div>
        </div>
        <div class="form-group">
          <label>养宠经验</label>
          <textarea name="experience" maxlength="500" placeholder="如：养过 3 只柯基，英短 5 年"></textarea>
        </div>
        <div class="form-group">
          <label>特殊服务</label>
          <div class="chip-group" id="special-services-chips"></div>
        </div>
        <button type="submit" id="host-form-submit" class="btn btn-primary btn-block">提交申请</button>
      </form>

      <!-- 可接单日期区（仅 active 可见） -->
      <div id="host-availability" class="host-availability host-banner-hidden">
        <div class="host-availability-header">
          <h3>可接单日期</h3>
          <span class="hint">点选两个日期形成区间，可添加多个</span>
        </div>
        <div class="cal-wrap">
          <div class="cal-nav">
            <button type="button" class="cal-nav-btn" id="cal-prev">‹</button>
            <div class="cal-month-label" id="cal-month-label">- 月</div>
            <button type="button" class="cal-nav-btn" id="cal-next">›</button>
          </div>
          <div class="cal-legend">
            <span class="cal-legend-item"><i class="cal-legend-swatch cal-legend-today"></i>今天</span>
            <span class="cal-legend-item"><i class="cal-legend-swatch cal-legend-picking"></i>点选中</span>
            <span class="cal-legend-item"><i class="cal-legend-swatch cal-legend-range"></i>可接单</span>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
        <div class="cal-ranges" id="cal-ranges"></div>
        <button type="button" id="host-availability-save" class="btn btn-primary btn-block">保存可接单日期</button>
      </div>
    </div>

  </div>

  <!-- 宠物表单 Modal -->
  <div id="pet-modal" class="modal">
    <div class="modal-mask"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="pet-modal-title">添加宠物</h3>
        <button class="modal-close" data-close>×</button>
      </div>
      <div class="modal-body">
        <form id="pet-form">
          <input type="hidden" name="petId">
          <div class="form-group">
            <label>名字 <span class="required">*</span></label>
            <input type="text" name="name" required maxlength="30" placeholder="如：豆豆">
          </div>
          <div class="form-group">
            <label>种类 <span class="required">*</span></label>
            <select name="species" required>
              <option value="">请选择</option>
              <option value="猫">🐱 猫</option>
              <option value="狗">🐶 狗</option>
              <option value="兔">🐰 兔</option>
              <option value="其他">🐾 其他</option>
            </select>
          </div>
          <div class="form-group">
            <label>品种</label>
            <input type="text" name="breed" maxlength="40" placeholder="如：柯基、英短">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>性别</label>
              <select name="gender">
                <option value="">未知</option>
                <option value="公">公</option>
                <option value="母">母</option>
              </select>
            </div>
            <div class="form-group">
              <label>年龄</label>
              <input type="text" name="age" maxlength="20" placeholder="如：2岁">
            </div>
          </div>
          <div class="form-group">
            <label>体重</label>
            <input type="text" name="weight" maxlength="20" placeholder="如：12kg">
          </div>
          <div class="form-group">
            <label>性格</label>
            <div class="chip-group" id="personality-chips"></div>
          </div>
          <div class="form-group">
            <label>健康说明</label>
            <textarea name="health_notes" maxlength="500" placeholder="疫苗、绝育、过敏源等"></textarea>
          </div>
          <div class="form-group">
            <label>每日习惯</label>
            <textarea name="daily_habits" maxlength="500" placeholder="作息、遛弯次数、饮食偏好"></textarea>
          </div>
          <div class="form-group">
            <label>特殊需求</label>
            <textarea name="special_needs" maxlength="500" placeholder="如：不能接触猫、需安静环境"></textarea>
          </div>

          <div class="form-group">
            <label>照片 <span class="hint">(jpg/png/webp，≤5MB/张，最多 9 张)</span></label>
            <div class="photo-picker" id="photo-picker"></div>
            <input type="file" id="photo-input" accept="image/jpeg,image/png,image/webp" multiple style="display:none">
            <button type="button" class="btn btn-secondary btn-block" id="btn-pick-photo">选择照片</button>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="pet-submit">保存</button>
        </form>
      </div>
    </div>
  </div>

  <!-- 需求表单 Modal -->
  <div id="need-modal" class="modal">
    <div class="modal-mask"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="need-modal-title">发布寄养需求</h3>
        <button class="modal-close" data-close>×</button>
      </div>
      <div class="modal-body">
        <form id="need-form">
          <input type="hidden" name="needId">
          <div class="form-group">
            <label>选择宠物 <span class="required">*</span></label>
            <select name="petId" required>
              <option value="">请选择宠物</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>起始日期 <span class="required">*</span></label>
              <input type="date" name="startDate" required>
            </div>
            <div class="form-group">
              <label>结束日期 <span class="required">*</span></label>
              <input type="date" name="endDate" required>
            </div>
          </div>
          <div class="form-group">
            <label>期望区域</label>
            <input type="text" name="expectedArea" maxlength="100" placeholder="如：朝阳区、海淀、望京">
          </div>
          <div class="form-group">
            <label>期望日费（元）</label>
            <input type="number" name="expectedPrice" min="0" step="1" placeholder="如：150">
          </div>
          <div class="form-group">
            <label>说明</label>
            <textarea name="description" maxlength="1000" placeholder="补充说明宠物的特殊需求、注意事项等"></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="need-submit">发布</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/pages/my.js"></script>
</body>
</html>
