<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="暖木家">
  <title>暖木家</title>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A6A44"/>
      <stop offset="1" stop-color="#7A4F31"/>
    </linearGradient>
  </defs>

  <!-- 木棕圆角底 -->
  <rect width="64" height="64" rx="14" fill="url(#wood)"/>

  <!-- 奶油色小屋：屋顶 + 墙 -->
  <path d="M13 30 L32 12.5 L51 30 Z" fill="#F5E6D3"/>
  <rect x="19.5" y="30" width="25" height="19.5" rx="2" fill="#F5E6D3"/>

  <!-- 珊瑚橘爪印（掌垫 + 四趾） -->
  <g fill="#E8845C">
    <ellipse cx="32" cy="45.2" rx="5.1" ry="4"/>
    <circle cx="25.2" cy="37.8" r="2.15"/>
    <circle cx="29.4" cy="34.7" r="2.25"/>
    <circle cx="34.6" cy="34.7" r="2.25"/>
    <circle cx="38.8" cy="37.8" r="2.15"/>
  </g>
</svg>
